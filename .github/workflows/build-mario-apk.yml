name: Build Mario APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Create Flutter project scaffold
        run: flutter create --project-name mario_game --no-pub mario_build

      - name: Copy game source
        run: cp flutter-mario/lib/main.dart mario_build/lib/main.dart

      - name: Install dependencies
        working-directory: mario_build
        run: flutter pub get

      - name: Build APK
        working-directory: mario_build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperMario-APK
          path: mario_build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
