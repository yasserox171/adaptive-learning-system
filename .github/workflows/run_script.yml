name: Run Hello Script

on:
  push:
    branches:
      - claude/mobile-app-programming-fkzt0u
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run hello_script.py
        run: python hello_script.py
